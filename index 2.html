<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Classroom Economy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #10201A;
    --surface: #172A21;
    --surface-alt: #1E3628;
    --ink: #EDE6D6;
    --muted: #8FA398;
    --brass: #C9A15A;
    --brass-dim: #8A723F;
    --positive: #6FA97C;
    --negative: #C4645B;
    --line: #2C4536;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Spectral', serif;
    font-weight:500;
    letter-spacing:.2px;
  }
  button{
    font-family:'IBM Plex Mono', monospace;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--brass-dim);
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
    border-radius:2px;
    transition:border-color .15s, color .15s, background .15s;
  }
  button:hover{ border-color:var(--brass); color:var(--brass); background:rgba(201,161,90,0.06); }
  button.primary{ border-color:var(--brass); color:var(--bg); background:var(--brass); font-weight:600; }
  button.primary:hover{ background:#DBB56E; color:var(--bg); }
  button.danger{ border-color:var(--negative); color:var(--negative); }
  button.danger:hover{ background:rgba(196,100,91,0.1); }
  button:disabled{ opacity:.35; cursor:default; }
  input, select{
    font-family:'IBM Plex Mono', monospace;
    background:var(--surface-alt);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    font-size:13px;
    border-radius:2px;
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }
  label{ font-size:11px; color:var(--muted); display:block; margin-bottom:4px; letter-spacing:.3px;}
  a{ color: var(--brass); }

  .app{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  .masthead{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--brass-dim); padding-bottom:14px; margin-bottom:22px;
  }
  .masthead h1{ font-size:26px; margin:0; }
  .masthead .who{ font-size:12px; color:var(--muted); text-align:right; }
  .masthead .who b{ color:var(--ink); }

  .center-screen{ display:flex; align-items:center; justify-content:center; min-height:80vh; }
  .login-card{ width:340px; border:1px solid var(--line); background:var(--surface); padding:28px; }
  .login-card h2{ margin-top:0; font-size:20px;}
  .login-card .field{ margin-bottom:14px; }
  .login-card input, .login-card select{ width:100%; }
  .role-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .role-toggle button{ flex:1; }
  .role-toggle button.active{ border-color:var(--brass); color:var(--brass); }
  .error-text{ color:var(--negative); font-size:12px; margin-top:8px; }
  .hint{ font-size:11px; color:var(--muted); margin-top:16px; line-height:1.5; }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .tabs button{ border:none; border-bottom:2px solid transparent; border-radius:0; padding:10px 14px; color:var(--muted); }
  .tabs button.active{ color:var(--brass); border-bottom-color:var(--brass); }
  .tabs button:hover{ background:none; color:var(--ink); }

  .panel{ border:1px solid var(--line); background:var(--surface); padding:20px; margin-bottom:18px; }
  .panel h3{ margin-top:0; font-size:15px; color:var(--brass); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:16px; }

  .balances{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; }
  .balance-box{ border:1px solid var(--line); padding:14px 16px; }
  .balance-box .label{ font-size:11px; color:var(--muted); }
  .balance-box .amount{ font-size:22px; margin-top:6px; }
  .amount.positive{ color:var(--positive); }
  .amount.negative{ color:var(--negative); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--muted); font-weight:500; font-size:11px; letter-spacing:.3px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }

  .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row .field{ min-width:140px; }

  .stock-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .stock-row:last-child{ border-bottom:none; }
  .stock-row .sym{ width:60px; font-weight:600; color:var(--brass); }
  .stock-row .name{ flex:1; color:var(--muted); font-size:12px; }
  .stock-row .price{ width:90px; text-align:right; }
  .stock-row .spark{ width:100px; }
  .stock-row .own{ width:90px; text-align:right; font-size:11px; color:var(--muted); }
  .stock-row .actions{ display:flex; gap:6px; }
  .stock-row .actions input{ width:56px; }

  .pill{ display:inline-block; padding:2px 8px; font-size:10px; border:1px solid var(--line); border-radius:10px; letter-spacing:.4px; }
  .pill.pending{ color:var(--brass); border-color:var(--brass-dim); }
  .pill.approved{ color:var(--positive); border-color:var(--positive); }
  .pill.denied{ color:var(--negative); border-color:var(--negative); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface-alt); border:1px solid var(--brass); color:var(--ink);
    padding:10px 18px; font-size:13px; z-index:50; max-width:80vw;
  }
  .muted{ color:var(--muted); }
  .empty{ color:var(--muted); font-size:13px; padding:14px 0; }
  .footer-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .loading{ display:flex; align-items:center; justify-content:center; min-height:80vh; color:var(--muted); }
  ::selection{ background:var(--brass-dim); color:var(--ink); }
</style>
</head>
<body>
<div id="root" class="loading">Opening the ledger…</div>

<script>
(function(){
  const root = document.getElementById('root');
  let roomId = new URLSearchParams(location.search).get('room') || '';
  const DEFAULT_STATE = {
    className: "Econ Class Economy",
    teacherPin: "1234",
    savingsRate: 0.03,
    retirementRate: 0.004,
    retirementPenaltyRate: 0.10,
    retirementUnlockRound: 999999,
    nextInterestNote: "",
    students: {},
    stocks: {
      BULL: { name: "Bullhorn Bakery", price: 50, history: [50], changeLog: [] },
      RCKT: { name: "Rocket Rides Inc.", price: 80, history: [80], changeLog: [] },
      SAFE: { name: "Steadfast Savings Co.", price: 20, history: [20], changeLog: [] },
      GLOW: { name: "Glowline Energy", price: 35, history: [35], changeLog: [] },
      HRVST: { name: "Harvest Grain Co.", price: 28, history: [28], changeLog: [] },
      PXFG: { name: "Pixel Forge Games", price: 42, history: [42], changeLog: [] },
      NWAIR: { name: "Northwind Airlines", price: 60, history: [60], changeLog: [] },
      LEDG: { name: "Ledger Systems", price: 95, history: [95], changeLog: [] },
      WNDR: { name: "Wanderlux Retail", price: 33, history: [33], changeLog: [] },
      CNST: { name: "Cornerstone Construction", price: 47, history: [47], changeLog: [] },
      INDEX: { name: "Whole-Market Index Fund", price: 49, history: [49], changeLog: [], isIndex:true }
    },
    redemptions: [],
    activity: [],
    marketRound: 0,
    insiderTips: [],
    taxRate: 0.15,
    taxDeduction: 150,
    communityFund: 0,
    jobs: [],
    news: [],
    shopItems: []
  };

  // 20 possible news events. Rarer tiers carry far bigger (and riskier) swings.
  const NEWS_EVENTS = [
    // COMMON — weight 10 each, mild moves
    { tier:'common', weight:10, pct:0.05, headline:c=>`${c} had a successful marketing campaign — investors like what they see.` },
    { tier:'common', weight:10, pct:0.06, headline:c=>`${c} beat quarterly earnings expectations.` },
    { tier:'common', weight:10, pct:-0.06, headline:c=>`${c} missed quarterly earnings expectations.` },
    { tier:'common', weight:10, pct:-0.04, headline:c=>`${c} announced a round of minor layoffs to cut costs.` },
    { tier:'common', weight:10, pct:0.04, headline:c=>`${c} signed a modest new supply deal.` },
    { tier:'common', weight:10, pct:-0.05, headline:c=>`${c} issued a small product recall.` },
    // UNCOMMON — weight 5 each, moderate moves
    { tier:'uncommon', weight:5, pct:0.15, headline:c=>`${c} landed a major new contract.` },
    { tier:'uncommon', weight:5, pct:-0.15, headline:c=>`${c} was hit with a costly lawsuit.` },
    { tier:'uncommon', weight:5, pct:0.18, headline:c=>`${c} unveiled a surprise-hit new product.` },
    { tier:'uncommon', weight:5, pct:-0.15, headline:c=>`${c} was revealed to use some shady supplier tactics.` },
    { tier:'uncommon', weight:5, pct:0.12, headline:c=>`${c}'s CEO made a bold announcement investors loved.` },
    { tier:'uncommon', weight:5, pct:-0.14, headline:c=>`${c} suffered a data breach affecting customers.` },
    // RARE — weight 2 each, big moves
    { tier:'rare', weight:2, pct:0.40, headline:c=>`${c} secured a breakthrough patent, opening a whole new market.` },
    { tier:'rare', weight:2, pct:0.30, headline:c=>`${c} became the target of a hostile takeover bid.` },
    { tier:'rare', weight:2, pct:-0.45, headline:c=>`${c} restated years of earnings after an accounting scandal.` },
    { tier:'rare', weight:2, pct:0.35, headline:c=>`${c} won a landmark court case against a rival.` },
    { tier:'rare', weight:2, pct:-0.40, headline:c=>`${c}'s flagship product was banned in a major market.` },
    // EXTREME — weight 1 each, huge moves, some with lingering volatility
    { tier:'extreme', weight:1, pct:2.00, volatilityMultiplier:3, volatilityDays:3, headline:c=>`${c} went viral overnight with a meme that took over the internet.` },
    { tier:'extreme', weight:1, pct:-0.95, headline:c=>`It came out that the people behind ${c} are actual criminals — the company is imploding.` },
    { tier:'extreme', weight:1, pct:1.50, volatilityMultiplier:2.5, volatilityDays:2, headline:c=>`${c} claimed a miracle breakthrough, sending speculative frenzy into overdrive.` }
  ];
  function pickWeighted(list){
    const total = list.reduce((sum,x)=>sum+x.weight,0);
    let r = Math.random()*total;
    for(const item of list){ r -= item.weight; if(r<=0) return item; }
    return list[list.length-1];
  }
  function tierLabel(tier){
    return { common:'common', uncommon:'uncommon', rare:'rare', extreme:'EXTREME' }[tier] || tier;
  }
  function tierPillClass(tier){
    if(tier==='extreme') return 'pill denied';
    if(tier==='rare') return 'pill pending';
    return 'pill';
  }
  function triggerNewsEvent(){
    const syms = Object.keys(state.stocks).filter(sym=>!state.stocks[sym].isIndex);
    if(syms.length===0) return null;
    const ev = pickWeighted(NEWS_EVENTS);
    const sym = syms[Math.floor(Math.random()*syms.length)];
    const st = state.stocks[sym];
    const oldPrice = st.price;
    let newPrice = Math.max(1, oldPrice * (1+ev.pct));
    newPrice = Math.round(newPrice*100)/100;
    st.price = newPrice;
    st.history.push(newPrice);
    if(st.history.length>60) st.history.shift();
    if(!st.changeLog) st.changeLog = [];
    st.changeLog.unshift({ ts:now(), round:state.marketRound, type:'news', from:oldPrice, to:newPrice });
    if(st.changeLog.length>60) st.changeLog.length = 60;
    if(ev.volatilityMultiplier){
      st.volatilityMultiplier = ev.volatilityMultiplier;
      st.volatilityRoundsLeft = ev.volatilityDays || 1;
    }
    const headline = ev.headline(st.name);
    const item = { id:genId(), ts:now(), round:state.marketRound, sym, headline, pct:ev.pct, tier:ev.tier };
    state.news.unshift(item);
    if(state.news.length>100) state.news.length = 100;
    addActivity(`📰 ${headline}`);
    return item;
  }

  let state = null;
  let session = null; // { role: 'teacher' } or { role:'student', id }
  let toastTimer = null;

  function genId(){ return Math.random().toString(36).slice(2,10); }
  function fmt(n){
    const sign = n < 0 ? "-" : "";
    return sign + Math.abs(Math.round(n)).toLocaleString() + " chips";
  }
  function fmtPrice(n){ return n.toFixed(2) + "c"; }
  function now(){ return Date.now(); }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + " " + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  function showToast(msg){
    let el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2600);
  }

  async function loadState(){
    try{
      const data = await fetchRoom(roomId);
      if(data && Object.keys(data).length){
        state = data;
        backfillState(state);
      } else {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        await saveState();
      }
    }catch(e){
      console.error('Load failed, starting fresh in memory', e);
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }
  function backfillState(st){
    for(const k in DEFAULT_STATE){ if(!(k in st)) st[k] = JSON.parse(JSON.stringify(DEFAULT_STATE[k])); }
    for(const sym in DEFAULT_STATE.stocks){ if(!st.stocks[sym]) st.stocks[sym] = JSON.parse(JSON.stringify(DEFAULT_STATE.stocks[sym])); }
    for(const sym in st.stocks){ if(!st.stocks[sym].changeLog) st.stocks[sym].changeLog = []; }
    for(const id in st.students){ if(typeof st.students[id].retirement !== 'number') st.students[id].retirement = 0; }
  }

  async function saveState(){
    try{
      const ok = await putRoom(roomId, state);
      if(!ok){ showToast('Save failed — try again'); return false; }
      return true;
    }catch(e){
      console.error('Save error', e);
      showToast('Save failed — check your connection and try again');
      return false;
    }
  }

  // ---------- Firebase Realtime Database room storage (no accounts, works from any device) ----------
  // Paste your database URL below, e.g. https://my-econ-class-default-rtdb.firebaseio.com
  const DB_URL = 'PASTE_YOUR_DATABASE_URL_HERE';
  function roomUrl(id){
    return DB_URL.replace(/\/+$/,'') + '/rooms/' + encodeURIComponent(id) + '.json';
  }
  // The whole economy is stored as one JSON string so Firebase never drops empty lists.
  async function fetchRoom(id){
    const res = await fetch(roomUrl(id), { cache:'no-store' });
    if(!res.ok) throw new Error('room fetch failed: ' + res.status);
    const obj = await res.json();
    if(!obj || typeof obj.data !== 'string') return {};
    return JSON.parse(obj.data);
  }
  async function putRoom(id, data){
    const res = await fetch(roomUrl(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: JSON.stringify(data) })
    });
    return res.ok;
  }
  function extractRoomId(input){
    // class code: letters, numbers, dashes only
    return input.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,40);
  }

  function addActivity(text){
    state.activity.unshift({ ts: now(), text });
    if(state.activity.length > 200) state.activity.length = 200;
  }
  function addHistory(student, type, desc, amount){
    student.history.unshift({ ts: now(), type, desc, amount });
    if(student.history.length > 200) student.history.length = 200;
  }
  function flagInsiderTrade(studentId, sym){
    const tip = state.insiderTips.find(t=>t.studentId===studentId && t.sym===sym && !t.resolved && !t.traded);
    if(tip) tip.traded = true;
  }
  function netWorth(student){
    let v = student.checking + student.savings + (student.retirement||0);
    for(const sym in student.portfolio){
      const q = student.portfolio[sym];
      const stock = state.stocks[sym];
      if(stock) v += q * stock.price;
    }
    return v;
  }
  function rollPriceChange(st, sym){
    // A stock already riding a bubble: keep inflating until its hidden countdown runs out, then burst.
    if(st.bubbleTicksLeft && st.bubbleTicksLeft > 0){
      st.bubbleTicksLeft -= 1;
      if(st.bubbleTicksLeft === 0){
        addActivity(`${sym}'s bubble burst!`);
        return { pct: -(0.45 + Math.random()*0.30), type: 'burst' }; // -45% to -75%
      }
      return { pct: 0.15 + Math.random()*0.20, type: 'bubble' }; // +15% to +35%
    }
    const roll = Math.random();
    if(roll < 0.02){
      // a bubble quietly starts — nobody is told, and how long it runs is random.
      st.bubbleTicksLeft = 2 + Math.floor(Math.random()*4); // 2-5 more rounds of inflation before it bursts
      return { pct: 0.15 + Math.random()*0.20, type: 'bubble' };
    }
    if(roll < 0.09){
      return { pct: -(0.10 + Math.random()*0.15), type: 'crash' }; // -10% to -25%
    }
    if(roll < 0.16){
      return { pct: 0.12 + Math.random()*0.18, type: 'spike' }; // +12% to +30%
    }
    // normal day-to-day drift: small, mildly upward-biased
    return { pct: -0.015 + Math.random()*0.04, type: 'normal' };
  }

  const expandedHistory = {};
  function changeTypeLabel(type){
    switch(type){
      case 'crash': return 'crash';
      case 'spike': return 'spike';
      case 'bubble': return 'strong gain';
      case 'burst': return 'bubble burst!';
      case 'manual': return 'price set by teacher';
      case 'ipo': return 'listed';
      case 'index': return 'index recalculated';
      case 'news': return 'news event';
      default: return 'daily move';
    }
  }
  function changeLogHtml(st){
    const log = (st.changeLog||[]).slice(0,15);
    if(log.length===0) return '<div class="empty" style="padding:8px 0 4px;">No recorded changes yet.</div>';
    return `<table><thead><tr><th>Round</th><th>Date</th><th>Event</th><th class="num">From</th><th class="num">To</th><th class="num">Change</th></tr></thead><tbody>
      ${log.map(e=>{
        const pct = e.from ? ((e.to-e.from)/e.from*100) : 0;
        const cls = pct>0?'positive':(pct<0?'negative':'');
        return `<tr><td class="muted">${e.round}</td><td class="muted">${fmtDate(e.ts)}</td><td>${changeTypeLabel(e.type)}</td><td class="num">${fmtPrice(e.from)}</td><td class="num">${fmtPrice(e.to)}</td><td class="num ${cls}">${pct>=0?'+':''}${pct.toFixed(1)}%</td></tr>`;
      }).join('')}
    </tbody></table>`;
  }

  function newsFeedHtml(limit){
    const items = state.news.slice(0, limit||100);
    if(items.length===0) return '<div class="empty">No news yet.</div>';
    return items.map(n=>{
      const st = state.stocks[n.sym];
      const pctStr = (n.pct>=0?'+':'') + Math.round(n.pct*100) + '%';
      const cls = n.pct>=0?'positive':'negative';
      return `
        <div style="border:1px solid var(--line); padding:12px 14px; margin-bottom:8px;">
          <div class="muted" style="font-size:11px; margin-bottom:6px;">Round ${n.round} · ${fmtDate(n.ts)} · <b style="color:var(--brass);">${n.sym}</b>${st?` (${escapeHtml(st.name)})`:''} <span class="${tierPillClass(n.tier)}" style="margin-left:6px;">${tierLabel(n.tier)}</span></div>
          <div>${escapeHtml(n.headline)}</div>
          <div class="num ${cls}" style="margin-top:6px; font-size:13px;">${pctStr}</div>
        </div>
      `;
    }).join('');
  }

  function sparkPath(history){
    const h = history.slice(-16);
    if(h.length < 2) return { d:'', up:true };
    const min = Math.min(...h), max = Math.max(...h);
    const range = (max - min) || 1;
    const w = 100, ht = 28, pad = 2;
    const pts = h.map((v,i)=>{
      const x = (i/(h.length-1)) * (w-2*pad) + pad;
      const y = ht - pad - ((v-min)/range)*(ht-2*pad);
      return [x,y];
    });
    const d = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    return { d, up: h[h.length-1] >= h[0] };
  }

  // ---------- render shell ----------
  function render(){
    root.className = '';
    if(!session){
      renderLogin();
    } else if(session.role === 'teacher'){
      renderTeacher();
    } else {
      renderStudent();
    }
  }

  // ---------- LOGIN ----------
  let loginRole = 'student';
  let loginError = '';
  function renderLogin(){
    const studentOptions = Object.values(state.students)
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    const recentNews = state.news.slice(0,3);
    root.innerHTML = `
      <div class="center-screen" style="gap:20px; flex-wrap:wrap;">
        <div class="login-card">
          <h2 class="serif">${escapeHtml(state.className)}</h2>
          <div class="role-toggle">
            <button data-role="student" class="${loginRole==='student'?'active':''}">Student</button>
            <button data-role="teacher" class="${loginRole==='teacher'?'active':''}">Teacher</button>
          </div>
          ${loginRole === 'student' ? `
            <div class="field">
              <label>Your name</label>
              <select id="stu-select">${studentOptions || '<option value="">No students added yet</option>'}</select>
            </div>
            <div class="field">
              <label>PIN</label>
              <input id="stu-pin" type="password" inputmode="numeric" placeholder="••••" />
            </div>
            <button class="primary" id="stu-login-btn" style="width:100%">Log in</button>
          ` : `
            <div class="field">
              <label>Teacher PIN</label>
              <input id="teach-pin" type="password" inputmode="numeric" placeholder="••••" />
            </div>
            <button class="primary" id="teach-login-btn" style="width:100%">Log in</button>
          `}

  }

  function marketHtml(s){

  function wireMarketActions(s){
    root.querySelectorAll('[data-act="togglehist"]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.key;
        expandedHistory[key] = !expandedHistory[key];
        render();
      };
    });
    root.querySelectorAll('[data-act="buy"],[data-act="sell"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const sym = btn.dataset.sym;
        const input = root.querySelector(`.qty-input[data-sym="${sym}"]`);
        const qty = parseInt(input.value,10);
        if(!qty || qty<=0){ showToast('Enter a quantity first'); return; }
        const st = state.stocks[sym];
        const cost = qty*st.price;
        if(btn.dataset.act==='buy'){
          if(cost > s.checking){ showToast('Not enough chips in checking'); return; }
          s.checking -= cost;
          s.portfolio[sym] = (s.portfolio[sym]||0) + qty;
          if(!st.isIndex) st.netDemandShares = (st.netDemandShares||0) + qty;
          addHistory(s,'buy',`Bought ${qty} ${sym} @ ${fmtPrice(st.price)}`, -cost);
          flagInsiderTrade(s.id, sym);
        } else {
          const owned = s.portfolio[sym]||0;
          if(qty > owned){ showToast("You don't own that many shares"); return; }
          s.portfolio[sym] = owned - qty;
          s.checking += cost;
          if(!st.isIndex) st.netDemandShares = (st.netDemandShares||0) - qty;
          addHistory(s,'sell',`Sold ${qty} ${sym} @ ${fmtPrice(st.price)}`, cost);
          flagInsiderTrade(s.id, sym);
        }
        await saveState();
        render();
      };
    });
  }

  function transferHtml(s){
    const locked = state.marketRound < state.retirementUnlockRound;
    return `
      <div class="panel">
        <h3>Move chips between accounts</h3>
        <div class="row">
          <div class="field">
            <label>Direction</label>
            <select id="dir">
              <option value="toSavings">Checking → Savings</option>
              <option value="toChecking">Savings → Checking</option>
              <option value="toRetirement">Checking → 401k</option>
              <option value="fromRetirement">401k → Checking</option>
            </select>
          </div>
          <div class="field">
            <label>Amount</label>
            <input id="amt" type="number" min="1" step="1" placeholder="chips" />
          </div>
          <button class="primary" id="do-transfer">Transfer</button>
        </div>
        <div class="hint">Your 401k grows a little on its own every time the market advances — slow and steady, no swings.
        ${locked
          ? ` Right now it's locked: pulling chips out before round ${state.retirementUnlockRound} costs a ${(state.retirementPenaltyRate*100).toFixed(0)}% penalty (forfeited to the community fund). We're on round ${state.marketRound}.`
          : ` It's unlocked — no penalty on withdrawals anymore.`}
        </div>
      </div>
    `;
  }
  function wireTransferActions(s){
    root.querySelector('#do-transfer').onclick = async ()=>{
      const dir = root.querySelector('#dir').value;
      const amt = parseInt(root.querySelector('#amt').value,10);
      if(!amt || amt<=0){ showToast('Enter an amount'); return; }
      if(dir==='toSavings'){
        if(amt>s.checking){ showToast('Not enough in checking'); return; }
        s.checking -= amt; s.savings += amt;
        addHistory(s,'transfer','Checking → Savings', -amt);
      } else if(dir==='toChecking'){
        if(amt>s.savings){ showToast('Not enough in savings'); return; }
        s.savings -= amt; s.checking += amt;
        addHistory(s,'transfer','Savings → Checking', -amt);
      } else if(dir==='toRetirement'){
        if(amt>s.checking){ showToast('Not enough in checking'); return; }
        s.checking -= amt; s.retirement = (s.retirement||0) + amt;
        addHistory(s,'transfer','Checking → 401k', -amt);
      } else if(dir==='fromRetirement'){
        if(amt>(s.retirement||0)){ showToast('Not enough in your 401k'); return; }
        const locked = state.marketRound < state.retirementUnlockRound;
        if(locked){
          const penalty = Math.round(amt * state.retirementPenaltyRate);
          const net = amt - penalty;
          if(!confirm(`Withdrawing now is early — you'll lose ${fmt(penalty)} as a penalty and only get ${fmt(net)} in checking. Continue?`)) return;
          s.retirement -= amt;
          s.checking += net;
          state.communityFund += penalty;
          addHistory(s,'penalty',`Early 401k withdrawal — kept ${fmt(net)}, ${fmt(penalty)} penalty to community fund`, -amt);
        } else {
          s.retirement -= amt; s.checking += amt;
          addHistory(s,'transfer','401k → Checking', -amt);
        }
      }
      await saveState();
      showToast('Done');
      render();
    };
  }

  function wireTeacherMarketActions(){
    root.querySelectorAll('[data-act="togglehist"]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.key;
        expandedHistory[key] = !expandedHistory[key];
        render();
      };
    });
    root.querySelector('#advance-market').onclick = async ()=>{
      state.marketRound += 1;
      for(const sym in state.stocks){
        const st = state.stocks[sym];
        if(st.isIndex) continue; // computed after the loop, from the others' new prices
        const oldPrice = st.price;
        const { pct, type } = rollPriceChange(st, sym);
        // buying pressure since the last advance nudges the move a little, but doesn't override it
        const demand = st.netDemandShares || 0;
        const demandPct = (type==='normal' || type==='crash' || type==='spike') ? Math.tanh(demand/40) * 0.05 : 0;
        let finalPct = pct + demandPct;
        if(st.volatilityMultiplier && st.volatilityMultiplier !== 1){
          finalPct = finalPct * st.volatilityMultiplier;
        }
        let newPrice = Math.max(1, oldPrice * (1+finalPct));
        newPrice = Math.round(newPrice*100)/100;
        st.price = newPrice;
        st.netDemandShares = 0;
        st.history.push(newPrice);
        if(st.history.length>60) st.history.shift();
        if(!st.changeLog) st.changeLog = [];
        st.changeLog.unshift({ ts: now(), round: state.marketRound, type, from: oldPrice, to: newPrice, demand });
        if(st.changeLog.length>60) st.changeLog.length = 60;
        if(st.volatilityRoundsLeft && st.volatilityRoundsLeft > 0){
          st.volatilityRoundsLeft -= 1;
          if(st.volatilityRoundsLeft <= 0){ st.volatilityMultiplier = 1; st.volatilityRoundsLeft = 0; }
        }
      }
      // the index fund just tracks the average of every real company
      const components = Object.values(state.stocks).filter(st=>!st.isIndex);
      if(components.length){
        const idx = state.stocks.INDEX;
        const oldIdx = idx.price;
        const avg = Math.round((components.reduce((sum,st)=>sum+st.price,0) / components.length) * 100) / 100;
        idx.price = avg;
        idx.history.push(avg);
        if(idx.history.length>60) idx.history.shift();
        if(!idx.changeLog) idx.changeLog = [];
        idx.changeLog.unshift({ ts: now(), round: state.marketRound, type:'index', from: oldIdx, to: avg });
        if(idx.changeLog.length>60) idx.changeLog.length = 60;
      }
      // 401k accounts grow a little every round — slow, steady, no volatility
      let grown = 0;
      for(const id in state.students){
        const s = state.students[id];
        if((s.retirement||0) > 0){
          const jitter = 0.8 + Math.random()*0.4; // stays gradual, never negative
          const growth = Math.max(1, Math.round(s.retirement * state.retirementRate * jitter));
          s.retirement += growth;
          addHistory(s,'retirement-growth','401k growth', growth);
          grown++;
        }
      }
      addActivity(`Market advanced to round ${state.marketRound}${grown?` — 401k grew for ${grown} student(s)`:''}`);
      // resolve any insider tips that were live during this round
      for(const tip of state.insiderTips){
        if(tip.resolved) continue;
        if(tip.traded){
          const caught = Math.random() < 0.45;
          tip.caught = caught;
          if(caught){
            const st2 = state.students[tip.studentId];
            if(st2){
              const fine = Math.min(st2.checking, Math.max(20, Math.round(st2.checking*0.3)));
              st2.checking -= fine;
              addHistory(st2,'sec-fine',`Caught trading ${tip.sym} on insider info — fined by the SEC`, -fine);
              addActivity(`🚨 ${st2.name} got caught trading ${tip.sym} on insider info and was fined ${fmt(fine)}`);
            }
          }
        }
        tip.resolved = true;
      }
      await saveState();
      showToast('Market advanced');
      render();
    };
    root.querySelectorAll('[data-act="setprice"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const sym = btn.dataset.sym;
        const input = root.querySelector(`.setprice-input[data-sym="${sym}"]`);
        const price = parseFloat(input.value);
        if(!price || price<=0){ showToast('Enter a valid price'); return; }
        const st = state.stocks[sym];
        const oldPrice = st.price;
        st.price = Math.round(price*100)/100;
        st.history.push(st.price);
        if(st.history.length>60) st.history.shift();
        if(!st.changeLog) st.changeLog = [];
        st.changeLog.unshift({ ts: now(), round: state.marketRound, type:'manual', from: oldPrice, to: st.price });
        if(st.changeLog.length>60) st.changeLog.length = 60;
        addActivity(`Teacher set ${sym} to ${fmtPrice(st.price)}`);
        await saveState();
        showToast('Price updated');
        render();
      };
    });
    root.querySelectorAll('[data-act="delstock"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const sym = btn.dataset.sym;
        if(!confirm(`Delete ${sym}? Students holding shares will keep them at the last price, but the stock will vanish from the market.`)) return;
        delete state.stocks[sym];
        await saveState();
        render();
      };
    });
    root.querySelector('#add-stock').onclick = async ()=>{
      const sym = root.querySelector('#ns-sym').value.trim().toUpperCase();
      const name = root.querySelector('#ns-name').value.trim();
      const price = parseFloat(root.querySelector('#ns-price').value);
      if(!sym || !name || !price || price<=0){ showToast('Fill in all fields'); return; }
      if(sym === 'INDEX'){ showToast('That symbol is reserved for the index fund'); return; }
      if(state.stocks[sym]){ showToast('That symbol already exists'); return; }
      state.stocks[sym] = { name, price, history:[price], changeLog:[{ ts: now(), round: state.marketRound, type:'ipo', from: price, to: price }] };
      addActivity(`Added new stock ${sym} — ${name}`);
      await saveState();
      showToast('Stock added');
      render();
    };
  }

  function wireRequestActions(){
    root.querySelectorAll('[data-act="approve"],[data-act="deny"]').forEach(btn=>{
      btn.onclick = async ()=>{

        const r = state.redemptions.find(x=>x.id===id);

        if(btn.dataset.act==='approve'){

            s.checking -= r.amount;

        }
        await saveState();
        render();
      };
    });
  }

      };
    });
    root.querySelectorAll('[data-act="approve-job"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const job = state.jobs.find(j=>j.id===btn.dataset.id);
        const sub = job.submissions.find(x=>x.studentId===btn.dataset.student && x.status==='pending');
        const st2 = state.students[btn.dataset.student];
        if(!job || !sub || !st2) return;
        sub.status = 'approved';
        st2.checking += job.reward;
        addHistory(st2,'job',`Paid for job: ${job.title}`, job.reward);
        addActivity(`Approved ${st2.name}'s work on "${job.title}" — paid ${fmt(job.reward)}`);
        await saveState();
        showToast('Approved and paid');
        render();
      };
    });
    root.querySelectorAll('[data-act="reject-job"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const job = state.jobs.find(j=>j.id===btn.dataset.id);
        const sub = job.submissions.find(x=>x.studentId===btn.dataset.student && x.status==='pending');
        if(!job || !sub) return;
        sub.status = 'rejected';
        await saveState();
        showToast('Rejected — they can try again');
        render();
      };
    });
    root.querySelectorAll('[data-act="delete-job"]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Delete this job? Any pending submissions will be lost.')) return;
        state.jobs = state.jobs.filter(j=>j.id!==btn.dataset.id);
        await saveState();
        render();
      };
    });
  }

  function teacherTaxesHtml(){
    const list = Object.values(state.students).map(s=>{
      const taxable = Math.max(0, s.checking - state.taxDeduction);
      const tax = Math.round(taxable * state.taxRate);
      return { s, taxable, tax };
    }).sort((a,b)=>b.tax-a.tax);
    const totalTax = list.reduce((sum,x)=>sum+x.tax,0);
    return `
      <div class="panel">
        <h3>Tax settings</h3>
        <p class="muted" style="font-size:13px;">Only checking balances are taxed — savings, 401k, and money invested in stocks are untouched. Everything collected, plus the community fund, gets divided evenly and rebated to every student.</p>
        <div class="row">
          <div class="field"><label>Tax rate (%)</label><input id="tax-rate" type="number" min="0" step="1" value="${(state.taxRate*100).toFixed(0)}"/></div>
          <div class="field"><label>Tax-free amount</label><input id="tax-deduction" type="number" min="0" step="10" value="${state.taxDeduction}"/></div>
          <button id="save-tax-settings">Update</button>
        </div>
      </div>
      <div class="panel">
        <h3>Preview — if you collected right now</h3>
        <div class="balances">
          <div class="balance-box"><div class="label">Total tax collected</div><div class="amount">${fmt(totalTax)}</div></div>
          <div class="balance-box"><div class="label">Community fund</div><div class="amount">${fmt(state.communityFund)}</div></div>
          <div class="balance-box"><div class="label">Rebate per student</div><div class="amount positive">${fmt(Object.keys(state.students).length ? Math.floor((totalTax+state.communityFund)/Object.keys(state.students).length) : 0)}</div></div>
        </div>
        ${list.length===0 ? '<div class="empty" style="margin-top:12px;">No students yet.</div>' :
          `<table style="margin-top:14px;"><thead><tr><th>Student</th><th class="num">Checking</th><th class="num">Taxable</th><th class="num">Tax owed</th></tr></thead><tbody>
            ${list.map(x=>`<tr><td>${escapeHtml(x.s.name)}</td><td class="num">${fmt(x.s.checking)}</td><td class="num">${fmt(x.taxable)}</td><td class="num negative">${fmt(x.tax)}</td></tr>`).join('')}
          </tbody></table>`}
        <div class="footer-actions">
          <button class="primary" id="collect-taxes">Collect taxes & redistribute now</button>
        </div>
      </div>
    `;
  }
  function wireTeacherTaxActions(){
    root.querySelector('#save-tax-settings').onclick = async ()=>{
      const rate = parseFloat(root.querySelector('#tax-rate').value);
      const deduction = parseInt(root.querySelector('#tax-deduction').value,10);
      if(isNaN(rate) || rate<0 || isNaN(deduction) || deduction<0){ showToast('Enter valid numbers'); return; }
      state.taxRate = rate/100;
      state.taxDeduction = deduction;
      await saveState();
      showToast('Tax settings updated');
      render();
    };
    root.querySelector('#collect-taxes').onclick = async ()=>{
      const ids = Object.keys(state.students);
      if(ids.length===0){ showToast('No students yet'); return; }
      let taxCollected = 0;
      for(const id of ids){
        const s = state.students[id];
        const taxable = Math.max(0, s.checking - state.taxDeduction);
        const tax = Math.round(taxable * state.taxRate);
        if(tax > 0){
          s.checking -= tax;
          addHistory(s,'tax','Paid taxes on checking', -tax);
          taxCollected += tax;
        }
      }
      const pool = taxCollected + state.communityFund;
      const rebate = Math.floor(pool / ids.length);
      const leftover = pool - rebate*ids.length;
      if(rebate > 0){
        for(const id of ids){
          const s = state.students[id];
          s.checking += rebate;
          addHistory(s,'rebate','Community rebate', rebate);
        }
      }
      state.communityFund = leftover;
      addActivity(`Tax day: collected ${fmt(taxCollected)} in taxes, rebated ${fmt(rebate)} to each of ${ids.length} students`);
      await saveState();
      showToast('Taxes collected and rebated');
      render();
    };
  }

  function teacherNewsHtml(){
    return `
      <div class="panel">
        <h3>📰 Publish news</h3>
        <p class="muted" style="font-size:13px;">Picks a random company and a random event — common events are mild, rare ones are big, and a small handful of extreme events can send a stock up hundreds of percent or wipe most of its value out. A few extreme events also leave that stock more volatile for the next few rounds.</p>
        <button class="primary" id="trigger-news">Publish a random news event</button>
      </div>
      <div class="panel">
        <h3>Market News</h3>
        ${newsFeedHtml()}
      </div>
    `;
  }
  function wireTeacherNewsActions(){
    root.querySelector('#trigger-news').onclick = async ()=>{
      const item = triggerNewsEvent();
      if(!item){ showToast('Add some stocks first'); return; }
      await saveState();
      showToast('Published!');

  function settingsHtml(){
    return `
      <div class="panel">
        <h3>Class name</h3>
        <div class="row">
          <div class="field" style="flex:1"><input id="cname" type="text" style="width:100%" value="${escapeHtml(state.className)}"/></div>
          <button id="save-cname">Save</button>
        </div>
      </div>
      <div class="panel">
        <h3>Savings interest</h3>
        <p class="muted" style="font-size:13px;">Current rate: ${(state.savingsRate*100).toFixed(1)}% per interest cycle.</p>
        <div class="row">
          <div class="field"><label>New rate (%)</label><input id="rate" type="number" min="0" step="0.1" value="${(state.savingsRate*100).toFixed(1)}"/></div>
          <button id="save-rate">Update rate</button>
          <button class="primary" id="pay-interest">Pay interest to everyone now</button>
        </div>
      </div>
      <div class="panel">
        <h3>401k growth rate</h3>
        <p class="muted" style="font-size:13px;">Current target: ${(state.retirementRate*100).toFixed(2)}% per market advance, applied automatically to every student's 401k — small and steady, no ups or downs.</p>
        <div class="row">
          <div class="field"><label>New rate (%)</label><input id="retire-rate" type="number" min="0" step="0.05" value="${(state.retirementRate*100).toFixed(2)}"/></div>
          <button id="save-retire-rate">Update rate</button>
        </div>
      </div>
      <div class="panel">
        <h3>401k early withdrawal penalty</h3>
        <p class="muted" style="font-size:13px;">We're on round ${state.marketRound}. Until the unlock round below, pulling chips out of a 401k costs a penalty (forfeited to the community fund) instead of arriving in checking whole. Set the unlock round low (or to the current round) to open it up right away.</p>
        <div class="row">
          <div class="field"><label>Penalty (%)</label><input id="retire-penalty" type="number" min="0" max="100" step="1" value="${(state.retirementPenaltyRate*100).toFixed(0)}"/></div>
          <div class="field"><label>Unlock round</label><input id="retire-unlock" type="number" min="0" step="1" value="${state.retirementUnlockRound}"/></div>
          <button id="save-retire-lock">Update</button>
        </div>
      </div>
      <div class="panel">
        <h3>Change teacher PIN</h3>
        <div class="row">
          <div class="field"><input id="new-teach-pin" type="text" placeholder="new PIN" maxlength="8"/></div>
          <button id="save-pin">Update PIN</button>
        </div>
      </div>
      <div class="panel">
        <h3>Danger zone</h3>
        <p class="muted" style="font-size:13px;">Wipes every student, balance, and transaction. Cannot be undone.</p>
        <button class="danger" id="reset-all">Reset entire economy</button>
      </div>
    `;
  }
  function wireSettingsActions(){
    root.querySelector('#save-cname').onclick = async ()=>{
      state.className = root.querySelector('#cname').value.trim() || state.className;
      await saveState(); showToast('Saved'); render();
    };
    root.querySelector('#save-rate').onclick = async ()=>{
      const r = parseFloat(root.querySelector('#rate').value);
      if(isNaN(r) || r<0){ showToast('Enter a valid rate'); return; }
      state.savingsRate = r/100;
      await saveState(); showToast('Rate updated'); render();
    };
    root.querySelector('#save-retire-rate').onclick = async ()=>{
      const r = parseFloat(root.querySelector('#retire-rate').value);
      if(isNaN(r) || r<0){ showToast('Enter a valid rate'); return; }
      state.retirementRate = r/100;
      await saveState(); showToast('Rate updated'); render();
    };
    root.querySelector('#save-retire-lock').onclick = async ()=>{
      const p = parseFloat(root.querySelector('#retire-penalty').value);
      const u = parseInt(root.querySelector('#retire-unlock').value,10);
      if(isNaN(p) || p<0 || p>100 || isNaN(u) || u<0){ showToast('Enter valid numbers'); return; }
      state.retirementPenaltyRate = p/100;
      state.retirementUnlockRound = u;
      await saveState(); showToast('Updated'); render();
    };
    root.querySelector('#pay-interest').onclick = async ()=>{
      let count = 0;
      for(const id in state.students){
        const s = state.students[id];
        if(s.savings > 0){
          const interest = Math.round(s.savings * state.savingsRate);
          if(interest > 0){
            s.savings += interest;
            addHistory(s,'interest','Interest paid on savings', interest);
            count++;
          }
        }
      }
      addActivity(`Paid interest to ${count} student(s) at ${(state.savingsRate*100).toFixed(1)}%`);
      await saveState();
      showToast(`Interest paid to ${count} student(s)`);
      render();
    };
    root.querySelector('#save-pin').onclick = async ()=>{
      const p = root.querySelector('#new-teach-pin').value.trim();
      if(!p){ showToast('Enter a PIN'); return; }
      state.teacherPin = p;
      await saveState(); showToast('PIN updated'); render();
    };
    root.querySelector('#reset-all').onclick = async ()=>{
      if(!confirm('This wipes the entire class economy. Are you sure?')) return;
      const keepPin = state.teacherPin;
      const keepName = state.className;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      state.teacherPin = keepPin;
      state.className = keepName;
      await saveState();
      session = null;
      showToast('Economy reset');
      render();
    };
  }

  // ---------- connect gate ----------
  function renderConnectGate(errorMsg){
    root.className = '';
    root.innerHTML = `
      <div class="center-screen">
        <div class="login-card">
          <h2 class="serif">Connect to your class</h2>
          <p class="muted" style="font-size:13px;">Teachers: make up a class code (letters and numbers, e.g. econ-p3-7391) and hit Connect to create your class. Students: use the link your teacher shared — it connects automatically.</p>
          <div class="field">
            <label>Class code</label>
            <input id="room-input" type="text" placeholder="e.g. econ-p3-7391" style="width:100%;"/>
          </div>
          <button class="primary" id="connect-btn" style="width:100%">Connect</button>
          ${errorMsg ? `<div class="error-text">${escapeHtml(errorMsg)}</div>` : ''}
        </div>
      </div>
    `;
    root.querySelector('#connect-btn').onclick = async ()=>{
      const raw = root.querySelector('#room-input').value;
      const id = extractRoomId(raw);
      if(!id){ renderConnectGate('Enter a class code first.'); return; }
      const btn = root.querySelector('#connect-btn');
      btn.disabled = true; btn.textContent = 'Connecting…';
      roomId = id;
      try{
        await loadState();
        const url = new URL(location.href);
        url.searchParams.set('room', roomId);
        history.replaceState(null, '', url.toString());
        render();
        startAutoRefresh();
      }catch(e){
        roomId = '';
        renderConnectGate('Could not connect — check your connection and try again.');
      }
    };
  }

  function startAutoRefresh(){
    setInterval(async ()=>{
      const active = document.activeElement;
      if(active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)) return; // don't clobber mid-typing
      try{
        const fresh = await fetchRoom(roomId);
        if(fresh && Object.keys(fresh).length){
          state = fresh;
          backfillState(state);
          render();
        }
      }catch(e){ /* offline or hiccup — next tick retries */ }
    }, 12000);
  }

  // ---------- boot ----------
  (async function boot(){
    if(!roomId){ renderConnectGate(); return; }
    await loadState();
    render();
    startAutoRefresh();
  })();
})();
</script>
